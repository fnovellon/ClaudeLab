<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bleachdle</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="victoryAnim" class="victory-anim" aria-hidden="true"></div>

  <header>
    <img src="favicon.svg" alt="" class="logo" width="56" height="56" />
    <h1>Bleachdle</h1>
    <p class="subtitle" id="subtitle">Devine le personnage Bleach du jour.</p>
  </header>

  <main>
    <div class="mode-toggle" role="tablist">
      <button id="dailyModeBtn" class="mode-btn active" type="button">Défi du jour</button>
      <button id="infiniteModeBtn" class="mode-btn" type="button">Illimité</button>
    </div>

    <div class="search-box">
      <input
        id="guessInput"
        type="text"
        autocomplete="off"
        placeholder="Nom d'un personnage..."
      />
      <div id="suggestions" class="suggestions" hidden></div>
    </div>

    <button id="newGameBtn" class="new-game-btn" type="button" hidden>Nouvelle partie</button>

    <p id="attemptsLeft" class="attempts"></p>
    <p id="message" class="message"></p>

    <section id="statsPanel" class="stats-panel" hidden>
      <h2 class="stats-title">Statistiques</h2>
      <div class="stats-grid">
        <div class="stat-tile">
          <span class="stat-value" id="statPlayed">0</span>
          <span class="stat-label">Parties</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="statWinRate">0%</span>
          <span class="stat-label">Victoires</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="statStreak">0</span>
          <span class="stat-label">Série actuelle</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="statMaxStreak">0</span>
          <span class="stat-label">Meilleure série</span>
        </div>
      </div>
      <h3 class="dist-title">Répartition des essais</h3>
      <div id="distribution" class="distribution"></div>
    </section>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>

    <section class="legend">
      <span class="legend-item"><span class="swatch correct"></span> Identique</span>
      <span class="legend-item"><span class="swatch partial"></span> Partiel</span>
      <span class="legend-item"><span class="swatch incorrect"></span> Différent</span>
      <span class="legend-item">▲ / ▼ = indice plus haut / plus bas</span>
      <span class="legend-item">Âge = tranche (10-20, 20-50, 50-100, 100-150, 150-1000, 1000+ ans)</span>
    </section>
  </main>

  <footer id="versionTag" class="version-tag"></footer>

  <script src="version.js"></script>
  <script src="characters.js"></script>
  <script src="game.js"></script>
</body>
</html>
